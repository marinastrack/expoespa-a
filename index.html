<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Penal Matemático HD - 7mo Grado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #070d19;
            user-select: none;
            overflow-x: hidden;
        }

        .font-game {
            font-family: 'Fredoka', cursive;
        }

        /* Stadium Pitch Background */
        .bg-pitch {
            background: radial-gradient(circle at center, #16a34a 0%, #15803d 60%, #14532d 100%);
        }

        /* Interactive Target Button Overlay on Goal Corners */
        .target-btn {
            background: rgba(15, 23, 42, 0.82);
            border: 2px dashed rgba(250, 204, 21, 0.85);
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .target-btn:hover, .target-btn:focus {
            border: 3px solid #38bdf8;
            background: rgba(14, 165, 233, 0.45);
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.9), inset 0 0 18px rgba(56, 189, 248, 0.6);
            transform: scale(1.06);
        }

        .target-btn:active {
            transform: scale(0.96);
        }

        #gameCanvas {
            touch-action: none;
            border-radius: 1rem;
        }

        .custom-modal {
            backdrop-filter: blur(12px);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(250, 204, 21, 0.4); }
            100% { box-shadow: 0 0 25px rgba(250, 204, 21, 0.9); }
        }

        .pulse-yellow {
            animation: pulseGlow 1.5s infinite alternate;
        }
    </style>
</head>

    <script>
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playWhistle() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, now);
                osc.frequency.exponentialRampToValueAtTime(1800, now + 0.22);
                
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playKick() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.15);

                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playGoal() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    
                    const startTime = now + idx * 0.08;
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.6);
                });
            }

            playSave() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const sound = new AudioEngine();

        const soundBtn = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        soundBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            soundIcon.className = sound.enabled ? 'fa-solid fa-volume-high text-lg' : 'fa-solid fa-volume-xmark text-lg text-rose-400';
        });
    </script>

    <script>
        const MathGenerator = {
            generate() {
                const types = [
                    'linearEquation',
                    'orderOfOps',
                    'percentages',
                    'fractions',
                    'powersRoots'
                ];
                const selectedType = types[Math.floor(Math.random() * types.length)];
                return this[selectedType]();
            },

            linearEquation() {
                const a = Math.floor(Math.random() * 5) + 2; // 2 to 6
                const x = Math.floor(Math.random() * 10) + 2; // 2 to 11
                const b = Math.floor(Math.random() * 15) + 3; // 3 to 17
                const rhs = a * x + b;
                
                const text = `${a}x + ${b} = ${rhs}  ⟶  ¿x = ?`;
                return this.formatQuestion(text, x);
            },

            orderOfOps() {
                const a = Math.floor(Math.random() * 6) + 2;
                const b = Math.floor(Math.random() * 5) + 2;
                const c = Math.floor(Math.random() * 15) + 10;
                
                const prod = a * b;
                const answer = c - prod;
                const text = `${c} - ${a} × ${b} = ?`;
                return this.formatQuestion(text, answer);
            },

            percentages() {
                const percents = [10, 20, 25, 50, 75];
                const p = percents[Math.floor(Math.random() * percents.length)];
                const multiples = [40, 80, 120, 160, 200, 240];
                const base = multiples[Math.floor(Math.random() * multiples.length)];
                
                const answer = (p * base) / 100;
                const text = `¿Cuánto es el ${p}% de ${base}?`;
                return this.formatQuestion(text, answer);
            },

            fractions() {
                const den = [2, 4, 5, 10][Math.floor(Math.random() * 4)];
                const num = Math.floor(Math.random() * (den - 1)) + 1;
                const base = den * (Math.floor(Math.random() * 8) + 3);

                const answer = (num * base) / den;
                const text = `¿Cuánto es ${num}/${den} de ${base}?`;
                return this.formatQuestion(text, answer);
            },

            powersRoots() {
                const isPower = Math.random() > 0.5;
                if (isPower) {
                    const base = Math.floor(Math.random() * 7) + 3;
                    const extra = Math.floor(Math.random() * 12) + 2;
                    const answer = Math.pow(base, 2) + extra;
                    const text = `${base}² + ${extra} = ?`;
                    return this.formatQuestion(text, answer);
                } else {
                    const roots = [16, 25, 36, 49, 64, 81, 100];
                    const r = roots[Math.floor(Math.random() * roots.length)];
                    const rootVal = Math.sqrt(r);
                    const extra = Math.floor(Math.random() * 10) + 3;
                    const answer = rootVal + extra;
                    const text = `√${r} + ${extra} = ?`;
                    return this.formatQuestion(text, answer);
                }
            },

            formatQuestion(text, correctAnswer) {
                const optionsSet = new Set([correctAnswer]);
                while (optionsSet.size < 4) {
                    const delta = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                    const wrongOption = correctAnswer + delta;
                    if (wrongOption >= 0) {
                        optionsSet.add(wrongOption);
                    }
                }

                const options = Array.from(optionsSet).sort(() => Math.random() - 0.5);
                return {
                    question: text,
                    correct: correctAnswer,
                    options: options
                };
            }
        };
    </script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Target Corners mapping
        const CORNERS = {
            'TL': { x: 0.28, y: 0.28 },
            'TR': { x: 0.72, y: 0.28 },
            'BL': { x: 0.28, y: 0.65 },
            'BR': { x: 0.72, y: 0.65 }
        };

        // Render Objects State
        let ball = {
            x: 0, y: 0, scale: 1,
            startX: 0, startY: 0,
            targetX: 0, targetY: 0,
            inFlight: false, progress: 0, spin: 0
        };

        let keeper = {
            x: 0, y: 0,
            startX: 0, startY: 0,
            targetX: 0, targetY: 0,
            isDiving: false, progress: 0, rotation: 0
        };

        let playerCharacter = {
            x: 0, y: 0,
            kickAnim: 0,
            runProgress: 0,
            isRunning: false
        };

        let confetti = [];
        let netBulge = 0;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * (window.devicePixelRatio || 1);
            canvas.height = rect.height * (window.devicePixelRatio || 1);
            resetPositions();
        }

        window.addEventListener('resize', resizeCanvas);

        function resetPositions() {
            const w = canvas.width;
            const h = canvas.height;

            // Ball at penalty spot
            ball.x = w * 0.5;
            ball.y = h * 0.76;
            ball.startX = ball.x;
            ball.startY = ball.y;
            ball.scale = w * 0.038;
            ball.inFlight = false;
            ball.progress = 0;

            // Keeper in center of goal
            keeper.x = w * 0.5;
            keeper.y = h * 0.38;
            keeper.startX = keeper.x;
            keeper.startY = keeper.y;
            keeper.isDiving = false;
            keeper.progress = 0;
            keeper.rotation = 0;

            // Kicker player behind ball
            playerCharacter.x = w * 0.29;
            playerCharacter.y = h * 0.81;
            playerCharacter.startX = playerCharacter.x;
            playerCharacter.startY = playerCharacter.y;
            playerCharacter.kickAnim = 0;
            playerCharacter.runProgress = 0;
            playerCharacter.isRunning = false;

            netBulge = 0;
        }

        function getCornerPixel(cornerKey) {
            const w = canvas.width;
            const h = canvas.height;
            const c = CORNERS[cornerKey] || CORNERS['TL'];
            const goalX = w * 0.22;
            const goalW = w * 0.56;
            const goalY = h * 0.12;
            const goalH = h * 0.42;

            return {
                x: goalX + goalW * c.x,
                y: goalY + goalH * c.y
            };
        }

        function drawScene() {
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            const horizon = h * 0.26;

            // 1. Stadium Sky & Night Crowd Silhouette
            const skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
            skyGrad.addColorStop(0, '#020617');
            skyGrad.addColorStop(0.7, '#0b1329');
            skyGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, horizon);

            // Crowd Audience Lights & Dots
            for (let i = 0; i < w; i += 8) {
                const dotY = horizon - 15 + Math.sin(i * 0.3) * 5;
                ctx.fillStyle = (i % 32 === 0 && Math.random() > 0.4) ? '#ffffff' : ((i % 16 === 0) ? '#f59e0b' : '#38bdf8');
                ctx.beginPath();
                ctx.arc(i, dotY, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }

            // Advertising Hoardings / Wall
            const wallH = h * 0.08;
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, horizon - wallH, w, wallH);
            
            // Ad Board Stripes
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(w * 0.05, horizon - wallH + 4, w * 0.25, wallH - 8);
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(w * 0.35, horizon - wallH + 4, w * 0.3, wallH - 8);
            ctx.fillStyle = '#eab308';
            ctx.fillRect(w * 0.7, horizon - wallH + 4, w * 0.25, wallH - 8);

            // 2. Striped Grass Pitch
            const grassTop = horizon;
            const grassHeight = h - grassTop;
            const numStripes = 9;
            const stripeH = grassHeight / numStripes;

            for (let i = 0; i < numStripes; i++) {
                const y1 = grassTop + i * stripeH;
                ctx.fillStyle = (i % 2 === 0) ? '#22c55e' : '#16a34a';
                ctx.fillRect(0, y1, w, stripeH + 1);
            }

            // Pitch Lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(3, w * 0.005);
            ctx.lineCap = 'square';

            // Penalty Box Outer Line
            const boxY1 = h * 0.38;
            const boxY2 = h * 0.92;
            ctx.beginPath();
            ctx.moveTo(w * 0.12, boxY2);
            ctx.lineTo(w * 0.14, boxY1);
            ctx.lineTo(w * 0.86, boxY1);
            ctx.lineTo(w * 0.88, boxY2);
            ctx.lineTo(w * 0.12, boxY2);
            ctx.stroke();

            // Goal Area Small Box
            const smallY1 = h * 0.32;
            ctx.beginPath();
            ctx.moveTo(w * 0.28, boxY1);
            ctx.lineTo(w * 0.29, smallY1);
            ctx.lineTo(w * 0.71, smallY1);
            ctx.lineTo(w * 0.72, boxY1);
            ctx.stroke();

            // Penalty Arc
            ctx.beginPath();
            ctx.arc(w * 0.5, h * 0.76, w * 0.18, Math.PI * 0.15, Math.PI * 0.85);
            ctx.stroke();

            // Penalty Spot
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(w * 0.5, h * 0.76, w * 0.012, h * 0.006, 0, 0, Math.PI * 2);
            ctx.fill();

            // 3. Goal Frame & Net Mesh
            drawGoal(w, h);

            // 4. Goalkeeper Character
            drawGoalkeeper(w, h);

            // 5. Shooter Player Character
            drawShooter(w, h);

            // 6. Ball & Dynamic Shadow
            drawBall(w, h);

            // 7. Confetti Particles
            updateAndDrawConfetti();
        }

        function drawGoal(w, h) {
            const goalX = w * 0.22;
            const goalW = w * 0.56;
            const goalY = h * 0.08;
            const goalH = h * 0.44;

            // Net Mesh
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.2;

            const cols = 24;
            const rows = 14;

            for (let i = 0; i <= cols; i++) {
                const x = goalX + (goalW / cols) * i;
                ctx.beginPath();
                ctx.moveTo(x, goalY);
                const flex = (netBulge > 0 && i > 6 && i < 18) ? Math.sin(netBulge * Math.PI) * 14 : 0;
                ctx.lineTo(x, goalY + goalH + flex);
                ctx.stroke();
            }

            for (let j = 0; j <= rows; j++) {
                const y = goalY + (goalH / rows) * j;
                ctx.beginPath();
                ctx.moveTo(goalX, y);
                ctx.lineTo(goalX + goalW, y);
                ctx.stroke();
            }

            // Goal Posts & Crossbar
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(6, w * 0.011);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'miter';

            ctx.beginPath();
            ctx.moveTo(goalX, goalY + goalH);
            ctx.lineTo(goalX, goalY);
            ctx.lineTo(goalX + goalW, goalY);
            ctx.lineTo(goalX + goalW, goalY + goalH);
            ctx.stroke();

            // Post Depth Shadows
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(goalX - 3, goalY);
            ctx.lineTo(goalX - 3, goalY + goalH);
            ctx.moveTo(goalX + goalW + 3, goalY);
            ctx.lineTo(goalX + goalW + 3, goalY + goalH);
            ctx.stroke();
        }

        function drawGoalkeeper(w, h) {
            ctx.save();
            ctx.translate(keeper.x, keeper.y);
            ctx.rotate(keeper.rotation);

            const scale = w * 0.0013;

            // Shadow under Keeper
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(0, 35 * scale, 22 * scale, 7 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Legs / Socks
            ctx.fillStyle = '#ea580c';
            ctx.fillRect(-12 * scale, 10 * scale, 7 * scale, 22 * scale);
            ctx.fillRect(5 * scale, 10 * scale, 7 * scale, 22 * scale);

            // Cleats / Shoes
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-14 * scale, 30 * scale, 10 * scale, 6 * scale);
            ctx.fillRect(4 * scale, 30 * scale, 10 * scale, 6 * scale);

            // Shorts
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-15 * scale, -2 * scale, 30 * scale, 15 * scale);

            // Torso / Jersey
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.roundRect(-16 * scale, -28 * scale, 32 * scale, 28 * scale, 5);
            ctx.fill();

            // Jersey Detail Lines
            ctx.fillStyle = '#ea580c';
            ctx.fillRect(-16 * scale, -10 * scale, 32 * scale, 4 * scale);

            // Arms & Gloves
            ctx.fillStyle = '#f97316';
            if (keeper.isDiving) {
                ctx.fillRect(-26 * scale, -24 * scale, 10 * scale, 7 * scale);
                ctx.fillRect(16 * scale, -24 * scale, 10 * scale, 7 * scale);
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(-30 * scale, -20 * scale, 6 * scale, 0, Math.PI * 2);
                ctx.arc(30 * scale, -20 * scale, 6 * scale, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillRect(-24 * scale, -22 * scale, 9 * scale, 16 * scale);
                ctx.fillRect(15 * scale, -22 * scale, 9 * scale, 16 * scale);
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.arc(-22 * scale, -6 * scale, 6 * scale, 0, Math.PI * 2);
                ctx.arc(22 * scale, -6 * scale, 6 * scale, 0, Math.PI * 2);
                ctx.fill();
            }

            // Head & Skin Tone
            ctx.fillStyle = '#fed7aa';
            ctx.beginPath();
            ctx.arc(0, -36 * scale, 9 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Blonde Hair
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, -39 * scale, 9.5 * scale, Math.PI, 0);
            ctx.fill();

            ctx.restore();
        }

        function drawShooter(w, h) {
            ctx.save();
            ctx.translate(playerCharacter.x, playerCharacter.y);

            const scale = w * 0.0016;

            // Shadow under Player
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 42 * scale, 24 * scale, 8 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            // Red Socks
            ctx.fillStyle = '#dc2626';
            let legOffset = playerCharacter.isRunning ? Math.sin(playerCharacter.runProgress * Math.PI * 6) * 12 * scale : 0;

            // Left & Right Leg
            ctx.fillRect((-14 * scale), (14 * scale) + legOffset, 8 * scale, 26 * scale);
            ctx.fillRect((4 * scale), (14 * scale) - legOffset, 8 * scale, 26 * scale);

            // Cleats
            ctx.fillStyle = '#0f172a';
            ctx.fillRect((-16 * scale), (38 * scale) + legOffset, 11 * scale, 6 * scale);
            ctx.fillRect((4 * scale), (38 * scale) - legOffset, 11 * scale, 6 * scale);

            // White Shorts
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-16 * scale, -2 * scale, 32 * scale, 18 * scale);

            // Red & Black Vertical Striped Jersey
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.roundRect(-18 * scale, -34 * scale, 36 * scale, 34 * scale, 6);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-12 * scale, -34 * scale, 6 * scale, 34 * scale);
            ctx.fillRect(0 * scale, -34 * scale, 6 * scale, 34 * scale);
            ctx.fillRect(12 * scale, -34 * scale, 4 * scale, 34 * scale);

            // Arms
            ctx.fillStyle = '#fed7aa';
            ctx.fillRect(-24 * scale, -28 * scale, 7 * scale, 20 * scale);
            ctx.fillRect(17 * scale, -28 * scale, 7 * scale, 20 * scale);

            // Head & Skin
            ctx.beginPath();
            ctx.arc(0, -44 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Blonde Hair
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(0, -47 * scale, 10.5 * scale, Math.PI * 0.85, Math.PI * 0.15);
            ctx.fill();

            ctx.restore();
        }

        function drawBall(w, h) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(ball.x, ball.y + ball.scale * 0.45, ball.scale * 0.85, ball.scale * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.spin);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, ball.scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, 0, ball.scale * 0.42, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(-ball.scale * 0.6, -ball.scale * 0.4, ball.scale * 0.25, 0, Math.PI * 2);
            ctx.arc(ball.scale * 0.6, ball.scale * 0.4, ball.scale * 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function updateAndDrawConfetti() {
            if (confetti.length === 0) return;

            confetti.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) confetti.splice(idx, 1);
            });
        }

        function triggerConfetti() {
            confetti = [];
            const colors = ['#facc15', '#38bdf8', '#4ade80', '#f43f5e', '#a855f7'];
            for (let i = 0; i < 75; i++) {
                confetti.push({
                    x: canvas.width * 0.5,
                    y: canvas.height * 0.4,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 14,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI,
                    vRot: (Math.random() - 0.5) * 0.2
                });
            }
        }
    </script>

    <script>
        let gameState = {
            round: 1,
            maxRounds: 5,
            playerScore: 0,
            cpuScore: 0,
            playerHistory: [],
            cpuHistory: [],
            turn: 'PLAYER',
            questionsAnswered: 0,
            questionsCorrect: 0,
            currentQuestion: null,
            isAnimating: false
        };

        const turnIndicator = document.getElementById('turnIndicator');
        const playerScoreEl = document.getElementById('playerScore');
        const cpuScoreEl = document.getElementById('cpuScore');
        const playerDots = document.getElementById('playerDots');
        const cpuDots = document.getElementById('cpuDots');
        const equationText = document.getElementById('equationText');
        const equationRoleTag = document.getElementById('equationRoleTag');
        const targetOverlay = document.getElementById('targetOverlay');
        const bannerMsg = document.getElementById('bannerMsg');

        function initGame() {
            gameState.round = 1;
            gameState.playerScore = 0;
            gameState.cpuScore = 0;
            gameState.playerHistory = [];
            gameState.cpuHistory = [];
            gameState.turn = 'PLAYER';
            gameState.questionsAnswered = 0;
            gameState.questionsCorrect = 0;
            gameState.isAnimating = false;

            updateScoreboardDots();
            nextTurn();
        }

        function updateScoreboardDots() {
            playerScoreEl.textContent = gameState.playerScore;
            cpuScoreEl.textContent = gameState.cpuScore;

            playerDots.innerHTML = '';
            cpuDots.innerHTML = '';

            for (let i = 0; i < gameState.maxRounds; i++) {
                const pDot = document.createElement('div');
                pDot.className = 'w-3.5 h-3.5 rounded-full border border-slate-600 flex items-center justify-center text-[9px] font-bold ';
                if (gameState.playerHistory[i] === 'GOAL') {
                    pDot.className += 'bg-emerald-500 text-slate-950 border-emerald-400';
                    pDot.innerHTML = '✓';
                } else if (gameState.playerHistory[i] === 'MISS') {
                    pDot.className += 'bg-rose-600 text-white border-rose-400';
                    pDot.innerHTML = '✕';
                } else {
                    pDot.className += 'bg-slate-800';
                }
                playerDots.appendChild(pDot);

                const cDot = document.createElement('div');
                cDot.className = 'w-3.5 h-3.5 rounded-full border border-slate-600 flex items-center justify-center text-[9px] font-bold ';
                if (gameState.cpuHistory[i] === 'GOAL') {
                    cDot.className += 'bg-emerald-500 text-slate-950 border-emerald-400';
                    cDot.innerHTML = '✓';
                } else if (gameState.cpuHistory[i] === 'MISS') {
                    cDot.className += 'bg-rose-600 text-white border-rose-400';
                    cDot.innerHTML = '✕';
                } else {
                    cDot.className += 'bg-slate-800';
                }
                cpuDots.appendChild(cDot);
            }
        }

        function nextTurn() {
            resetPositions();
            gameState.isAnimating = false;

            if (isShootoutFinished()) {
                endGame();
                return;
            }

            gameState.currentQuestion = MathGenerator.generate();
            equationText.textContent = gameState.currentQuestion.question;

            const buttons = targetOverlay.querySelectorAll('.target-btn');
            const options = gameState.currentQuestion.options;

            buttons.forEach((btn, idx) => {
                const valSpan = btn.querySelector('.target-value');
                valSpan.textContent = options[idx];
                btn.dataset.val = options[idx];
            });

            if (gameState.turn === 'PLAYER') {
                turnIndicator.textContent = `RONDA ${gameState.round} • TU TURNO DE PATEAR`;
                turnIndicator.className = "text-xs md:text-sm font-bold text-yellow-400 font-game uppercase tracking-wider";
                equationRoleTag.textContent = "⚽ ¡Elige la respuesta correcta en el arco para patear y hacer el gol!";
                equationRoleTag.className = "text-xs font-bold uppercase tracking-widest text-emerald-400 block mb-0.5";
            } else {
                turnIndicator.textContent = `RONDA ${gameState.round} • RIVAL PATEA (VOS ATAJÁS)`;
                turnIndicator.className = "text-xs md:text-sm font-bold text-rose-400 font-game uppercase tracking-wider";
                equationRoleTag.textContent = "🧤 ¡Elige la respuesta correcta para tirarte con el arquero y atajar!";
                equationRoleTag.className = "text-xs font-bold uppercase tracking-widest text-amber-400 block mb-0.5";
            }

            targetOverlay.classList.remove('hidden', 'opacity-0');
        }

        function isShootoutFinished() {
            const pShots = gameState.playerHistory.length;
            const cShots = gameState.cpuHistory.length;

            if (pShots === gameState.maxRounds && cShots === gameState.maxRounds) {
                return true;
            }

            const pRemaining = gameState.maxRounds - pShots;
            const cRemaining = gameState.maxRounds - cShots;

            if (gameState.playerScore > gameState.cpuScore + cRemaining) return true;
            if (gameState.cpuScore > gameState.playerScore + pRemaining) return true;

            return false;
        }

        targetOverlay.addEventListener('click', (e) => {
            const btn = e.target.closest('.target-btn');
            if (!btn || gameState.isAnimating) return;

            gameState.isAnimating = true;
            gameState.questionsAnswered++;

            const selectedVal = parseFloat(btn.dataset.val);
            const cornerKey = btn.dataset.corner;
            const isCorrect = (selectedVal === gameState.currentQuestion.correct);

            if (isCorrect) gameState.questionsCorrect++;

            targetOverlay.classList.add('opacity-0', 'hidden');

            if (gameState.turn === 'PLAYER') {
                executePlayerKick(cornerKey, isCorrect);
            } else {
                executeCpuKick(cornerKey, isCorrect);
            }
        });

        function executePlayerKick(cornerKey, isCorrect) {
            sound.playWhistle();

            playerCharacter.isRunning = true;
            const runDuration = 25;
            let runFrame = 0;

            function runStep() {
                runFrame++;
                playerCharacter.runProgress = runFrame / runDuration;
                playerCharacter.x = playerCharacter.startX + (canvas.width * 0.17) * playerCharacter.runProgress;
                playerCharacter.y = playerCharacter.startY - (canvas.height * 0.04) * playerCharacter.runProgress;

                if (runFrame < runDuration) {
                    requestAnimationFrame(runStep);
                } else {
                    playerCharacter.isRunning = false;
                    sound.playKick();
                    
                    const targetPixel = getCornerPixel(cornerKey);
                    ball.targetX = targetPixel.x;
                    ball.targetY = targetPixel.y;
                    ball.inFlight = true;

                    keeper.isDiving = true;
                    if (isCorrect) {
                        const oppositeKey = cornerKey.includes('L') ? 'TR' : 'TL';
                        const wrongPixel = getCornerPixel(oppositeKey);
                        keeper.targetX = wrongPixel.x;
                        keeper.targetY = wrongPixel.y;
                        keeper.rotation = cornerKey.includes('L') ? 0.65 : -0.65;
                    } else {
                        keeper.targetX = targetPixel.x;
                        keeper.targetY = targetPixel.y;
                        keeper.rotation = cornerKey.includes('L') ? -0.7 : 0.7;
                    }

                    animateShot(() => {
                        if (isCorrect) {
                            sound.playGoal();
                            gameState.playerScore++;
                            gameState.playerHistory.push('GOAL');
                            showBanner("¡GOOOOOOL!", "text-emerald-400 border-emerald-400");
                            triggerConfetti();
                            netBulge = 1;
                        } else {
                            sound.playSave();
                            gameState.playerHistory.push('MISS');
                            showBanner("¡ATAJÓ EL ARQUERO!", "text-rose-400 border-rose-400");
                        }

                        updateScoreboardDots();

                        setTimeout(() => {
                            gameState.turn = 'CPU';
                            nextTurn();
                        }, 2200);
                    });
                }
            }

            requestAnimationFrame(runStep);
        }

        function executeCpuKick(userCornerChoice, userIsCorrect) {
            sound.playWhistle();

            playerCharacter.isRunning = true;
            let runFrame = 0;
            const runDuration = 20;

            function runStep() {
                runFrame++;
                playerCharacter.runProgress = runFrame / runDuration;
                playerCharacter.x = playerCharacter.startX + (canvas.width * 0.17) * playerCharacter.runProgress;

                if (runFrame < runDuration) {
                    requestAnimationFrame(runStep);
                } else {
                    playerCharacter.isRunning = false;
                    sound.playKick();

                    const corners = ['TL', 'TR', 'BL', 'BR'];
                    const cpuTargetCorner = corners[Math.floor(Math.random() * corners.length)];
                    const cpuTargetPixel = getCornerPixel(cpuTargetCorner);

                    ball.targetX = cpuTargetPixel.x;
                    ball.targetY = cpuTargetPixel.y;
                    ball.inFlight = true;

                    keeper.isDiving = true;
                    if (userIsCorrect) {
                        keeper.targetX = cpuTargetPixel.x;
                        keeper.targetY = cpuTargetPixel.y;
                        keeper.rotation = cpuTargetCorner.includes('L') ? -0.7 : 0.7;
                    } else {
                        const wrongPixel = getCornerPixel(userCornerChoice);
                        keeper.targetX = wrongPixel.x;
                        keeper.targetY = wrongPixel.y;
                        keeper.rotation = userCornerChoice.includes('L') ? -0.6 : 0.6;
                    }

                    animateShot(() => {
                        if (userIsCorrect) {
                            sound.playSave();
                            gameState.cpuHistory.push('MISS');
                            showBanner("¡GRAN ATAJADA!", "text-yellow-300 border-yellow-400");
                        } else {
                            sound.playGoal();
                            gameState.cpuScore++;
                            gameState.cpuHistory.push('GOAL');
                            showBanner("GOL DE LA CPU", "text-rose-400 border-rose-400");
                            netBulge = 1;
                        }

                        updateScoreboardDots();

                        setTimeout(() => {
                            gameState.round++;
                            gameState.turn = 'PLAYER';
                            nextTurn();
                        }, 2200);
                    });
                }
            }

            requestAnimationFrame(runStep);
        }

        function animateShot(onComplete) {
            const duration = 40;
            let frame = 0;

            function step() {
                frame++;
                const t = frame / duration;
                const easeT = 1 - Math.pow(1 - t, 2);

                ball.x = ball.startX + (ball.targetX - ball.startX) * easeT;
                ball.y = ball.startY + (ball.targetY - ball.startY) * easeT;
                ball.scale = (canvas.width * 0.038) * (1 - easeT * 0.52);
                ball.spin += 0.28;

                keeper.x = keeper.startX + (keeper.targetX - keeper.startX) * easeT;
                keeper.y = keeper.startY + (keeper.targetY - keeper.startY) * easeT;

                if (frame < duration) {
                    requestAnimationFrame(step);
                } else {
                    onComplete();
                }
            }

            requestAnimationFrame(step);
        }

        function showBanner(text, styleClass) {
            bannerMsg.textContent = text;
            bannerMsg.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-950/95 border-4 font-game text-2xl sm:text-4xl px-8 py-4 rounded-3xl shadow-2xl transform scale-100 opacity-100 transition-all duration-300 pointer-events-none text-center z-20 ${styleClass}`;

            setTimeout(() => {
                bannerMsg.className = bannerMsg.className.replace('scale-100 opacity-100', 'scale-75 opacity-0');
            }, 1800);
        }

        function endGame() {
            const modal = document.getElementById('gameOverModal');
            const endTitle = document.getElementById('endTitle');
            const endSubtitle = document.getElementById('endSubtitle');
            const trophyIcon = document.getElementById('trophyIcon');
            const finalUserScore = document.getElementById('finalUserScore');
            const finalCpuScore = document.getElementById('finalCpuScore');
            const mathAccuracy = document.getElementById('mathAccuracy');
            const accuracyBar = document.getElementById('accuracyBar');

            finalUserScore.textContent = gameState.playerScore;
            finalCpuScore.textContent = gameState.cpuScore;

            const accuracy = gameState.questionsAnswered > 0
                ? Math.round((gameState.questionsCorrect / gameState.questionsAnswered) * 100)
                : 0;

            mathAccuracy.textContent = `${accuracy}% (${gameState.questionsCorrect}/${gameState.questionsAnswered})`;
            accuracyBar.style.width = `${accuracy}%`;

            if (gameState.playerScore > gameState.cpuScore) {
                endTitle.textContent = "¡CAMPEONES!";
                endTitle.className = "text-3xl font-black font-game text-emerald-400 mb-1";
                endSubtitle.textContent = "¡Ganaste la tanda de penales con genialidad matemática!";
                trophyIcon.className = "fa-solid fa-trophy text-yellow-400";
                sound.playGoal();
            } else if (gameState.playerScore < gameState.cpuScore) {
                endTitle.textContent = "DERROTA EN PENALES";
                endTitle.className = "text-3xl font-black font-game text-rose-400 mb-1";
                endSubtitle.textContent = "El rival ganó la tanda. ¡Practicá tus ejercicios y revancha!";
                trophyIcon.className = "fa-solid fa-heart-crack text-rose-400";
            } else {
                endTitle.textContent = "¡EMPATE TÉCNICO!";
                endTitle.className = "text-3xl font-black font-game text-yellow-400 mb-1";
                endSubtitle.textContent = "¡Gran esfuerzo de ambos equipos en los 5 penales!";
                trophyIcon.className = "fa-solid fa-handshake text-yellow-400";
            }

            modal.classList.remove('hidden');
        }

        function mainLoop() {
            drawScene();
            requestAnimationFrame(mainLoop);
        }

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOverModal').classList.add('hidden');
            initGame();
        });

        document.getElementById('playAgainBtn').addEventListener('click', () => {
            document.getElementById('gameOverModal').classList.add('hidden');
            initGame();
        });

        resizeCanvas();
        initGame();
        requestAnimationFrame(mainLoop);
    </script>
